# Instancia BD (ver DESPLIEGUE-AWS.md). Solo PostgreSQL; el security group deja entrar al 5432 únicamente a la instancia BACK.
name: control-escolar-bd

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_escolar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?pon DB_PASSWORD en .env}
      TZ: America/Mexico_City
    volumes:
      - datos-db:/var/lib/postgresql/data
      # Solo la primera vez (volumen vacío): esquema y datos de prueba.
      - ../../database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_escolar"]
      interval: 5s
      retries: 20

volumes:
  datos-db:
